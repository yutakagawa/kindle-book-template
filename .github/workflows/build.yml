name: Build EPUB

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PANDOC_VERSION: "3.9"
  EPUBCHECK_VERSION: "5.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install EPUBCheck
        run: |
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          mkdir -p tools && unzip -q /tmp/epubcheck.zip -d tools

      # books/ 以下の全ての本（縦書き・横書きの両サンプル）をビルドし、EPUBCheck で検証する
      - name: Build and validate EPUBs
        run: python3 scripts/build.py --all --check

      - name: Upload EPUBs
        uses: actions/upload-artifact@v4
        with:
          name: epub
          path: dist/*.epub
          if-no-files-found: error
