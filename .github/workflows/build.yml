name: Build EPUB / Paperback PDF

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PANDOC_VERSION: "3.9"
  EPUBCHECK_VERSION: "5.3.0"

jobs:
  # book.yaml の設定どおりにビルドし、KDP にアップロードする EPUB を Artifacts に置く
  build:
    name: Build (book.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-tools
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}
          epubcheck-version: ${{ env.EPUBCHECK_VERSION }}

      # 警告が 1 件でもあれば失敗する（scripts/validate.py が EPUBCheck の JSON レポートを判定）
      - name: Build and validate EPUBs
        run: python3 scripts/build.py --all --check --fail-on warning --report-dir dist/reports

      - name: Upload EPUBs
        uses: actions/upload-artifact@v6
        with:
          name: epub
          path: dist/*.epub
          if-no-files-found: error

      # KDP に入力する内容紹介・キーワード・カテゴリーの下書き。KDP の上限を超えたら失敗する
      - name: Draft KDP listings
        run: python3 scripts/kdp-listing.py --all --strict --json

      - name: Upload KDP listing drafts
        uses: actions/upload-artifact@v6
        with:
          name: kdp-listing
          path: |
            dist/*-kdp-listing.md
            dist/*-kdp-listing.json
          if-no-files-found: error

      - name: Upload EPUBCheck reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: epubcheck-reports
          path: dist/reports/
          if-no-files-found: ignore

  # books/ 以下の全ての本を「縦書き」「横書き」の両方でビルドして検証する。
  # 片方のモードでしか使われない CSS・フィルタの処理も毎回 EPUBCheck を通す
  validate:
    name: Validate (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [vertical, horizontal]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-tools
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}
          epubcheck-version: ${{ env.EPUBCHECK_VERSION }}

      - name: Build and validate (${{ matrix.mode }})
        run: >-
          python3 scripts/build.py --all
          --writing-mode ${{ matrix.mode }}
          -o dist/modes
          --check --fail-on warning
          --report-dir dist/modes/reports

      - name: Upload EPUBs and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: epub-${{ matrix.mode }}
          path: dist/modes/
          if-no-files-found: ignore

  # 同じ原稿から KDP ペーパーバック用の本文 PDF を「縦書き」「横書き」の両方で作る。
  # 判型・余白・ページサイズ・フォントの埋め込みは scripts/paperback.py が確認し、満たさなければ失敗する
  paperback:
    name: Paperback PDF (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [vertical, horizontal]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-tools
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}
          epubcheck-version: ${{ env.EPUBCHECK_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install npm packages (Vivliostyle)
        run: npm ci

      # 明朝体・ゴシック体の日本語フォント（PDF に埋め込まれる）
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra

      # ランナーに入っている Chrome を使う（無ければ Vivliostyle が自動でダウンロードする）
      - name: Use the preinstalled Chrome
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "VIVLIOSTYLE_BROWSER=$chrome" >> "$GITHUB_ENV"; fi

      - name: Build paperback PDFs (${{ matrix.mode }})
        run: python3 scripts/build.py --all --paperback --writing-mode ${{ matrix.mode }} -o dist/paperback

      - name: Upload PDFs
        uses: actions/upload-artifact@v6
        with:
          name: paperback-${{ matrix.mode }}
          path: dist/paperback/*.pdf
          if-no-files-found: error
