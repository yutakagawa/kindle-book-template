name: Build EPUB

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PANDOC_VERSION: "3.9"
  EPUBCHECK_VERSION: "5.3.0"

jobs:
  # book.yaml の設定どおりにビルドし、KDP にアップロードする EPUB を Artifacts に置く
  build:
    name: Build (book.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-tools
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}
          epubcheck-version: ${{ env.EPUBCHECK_VERSION }}

      # 警告が 1 件でもあれば失敗する（scripts/validate.py が EPUBCheck の JSON レポートを判定）
      - name: Build and validate EPUBs
        run: python3 scripts/build.py --all --check --fail-on warning --report-dir dist/reports

      - name: Upload EPUBs
        uses: actions/upload-artifact@v5
        with:
          name: epub
          path: dist/*.epub
          if-no-files-found: error

      - name: Upload EPUBCheck reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: epubcheck-reports
          path: dist/reports/
          if-no-files-found: ignore

  # books/ 以下の全ての本を「縦書き」「横書き」の両方でビルドして検証する。
  # 片方のモードでしか使われない CSS・フィルタの処理も毎回 EPUBCheck を通す
  validate:
    name: Validate (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [vertical, horizontal]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-tools
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}
          epubcheck-version: ${{ env.EPUBCHECK_VERSION }}

      - name: Build and validate (${{ matrix.mode }})
        run: >-
          python3 scripts/build.py --all
          --writing-mode ${{ matrix.mode }}
          -o dist/modes
          --check --fail-on warning
          --report-dir dist/modes/reports

      - name: Upload EPUBs and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: epub-${{ matrix.mode }}
          path: dist/modes/
          if-no-files-found: ignore
