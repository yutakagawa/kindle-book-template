# =====================================================================
# 本の設定ファイル（scripts/new-book.py で作成。横書き）
# 設定項目の詳細は README の「設定ファイル book.yaml」を参照してください。
# =====================================================================

# ---- 書誌情報（EPUB のメタデータになります） ----
title: "プログラミング知識ゼロの私が、AIと3日間でKindle出版ツールを作った話"
# title_kana: ""                                    # 読み（並べ替え用。省略可）
# subtitle: ""
author:
  - name: "蟹和氏"
    # kana: ""                                      # 読み（省略可）
# publisher: ""                                     # 個人出版なら著者名やレーベル名（省略可）
language: ja
date: 2026-11-04                                    # 出版日（YYYY-MM-DD）
description: >-
  プログラミング知識ゼロの会社員が、期限付きのAIクレジットを使い切るために、
  AIと3日間でKindle本を作るためのテンプレートを完成させた体験記です。
  実際に送った指示文と、つまずいた失敗をそのまま紹介します。
keywords: [AI, Claude, Kindle, KDP, 電子書籍, 自費出版, 体験記]
rights: "© 2026 蟹和氏"

# ---- 識別子 ----
# KDP の電子書籍に ISBN は不要です。uuid はこの本専用の値です（変更しないでください）。
isbn: ""
uuid: f5224344-22e5-4056-971a-341fcf302c37

# ---- 表紙 ----
# 表紙画像を用意したら images/cover.jpg に置き、下の cover のコメントを外して cover_design を消します。
# KDP 推奨: 高さ 2560 × 幅 1600 ピクセル（縦横比 1.6:1）、JPEG、RGB。
# cover: images/cover.jpg
# それまでは title / author から表紙を自動生成します（dist/<名前>-cover.jpg）。
cover_design:
  style: auto                    # auto（layout.writing_mode に合わせる）/ vertical / horizontal
  colors: ["#14213d", "#2c4f7c"]
  gradient: diagonal               # vertical / horizontal / diagonal / radial
  font: sans                      # serif（明朝）/ sans（ゴシック）/ フォントファイルのパス

# ---- 原稿（この順番で 1 冊になります） ----
chapters:
  - chapters/00-preface.md
  - chapters/01-start.md
  - chapters/02-parallel.md
  - chapters/03-stumble.md
  # 取材メモ notes.md はビルド対象に含めない

# ---- 組版 ----
layout:
  writing_mode: horizontal     # horizontal = 横書き・左綴じ / vertical = 縦書き・右綴じ
  toc_title: 目次
  toc_depth: 2                 # 目次に載せる見出しの深さ（1〜3）
  number_chapters: true        # 章番号を付ける（{.unnumbered} を付けた章は除く）
  chapter_label: "第{n}章"
  appendix_label: "付録{n}"
  figure_label: "図{c}.{n}"     # {c}=章番号, {n}=章内の通し番号
  table_label: "表{c}.{n}"
  listing_label: "リスト{c}.{n}"
  vertical:                    # 縦書きのときだけ使う設定
    code_blocks: sideways      # sideways / horizontal / vertical
    tables: sideways
    tcy_digits: 2              # 何桁までの数字を縦中横にするか

# ---- ペーパーバック（紙の本。python3 scripts/build.py --paperback で本文 PDF を作る） ----
paperback:
  trim: a5                     # 判型: 5x8 / 5.5x8.5 / 6x9 などの KDP 標準サイズ、a5 / b6
  bleed: false                 # 裁ち落とし（画像や色を紙の端まで印刷するときだけ true）
  paper: white                 # white（白）/ cream（クリーム）/ color（カラー）
  font: serif                  # 本文の書体: serif（明朝）/ sans（ゴシック）/ フォント名
  font_size: 9.5pt             # 本文の文字の大きさ
  line_height: 1.7             # 行送り（文字の大きさに対する倍率）
