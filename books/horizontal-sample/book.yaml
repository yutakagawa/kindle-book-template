# =====================================================================
# 本の設定ファイル（横書きサンプル）
# このディレクトリをコピーして新しい本を作り、この値を書き換えてください。
# =====================================================================

# ---- 書誌情報（EPUB のメタデータになります） ----
title: Markdownで作るKindle技術書
title_kana: マークダウンデツクルキンドルギジュツショ   # 読み（並べ替え用。省略可）
subtitle: 原稿からKDP出版まで
author:
  - name: 山田 太郎
    kana: ヤマダ タロウ                              # 読み（省略可）
# contributors:                                     # 共著者以外の協力者（省略可）
#   - name: 鈴木 花子
#     role: ill                                     # ill=イラスト, edt=編集, trl=翻訳 など
publisher: サンプル出版                               # 個人出版なら著者名やレーベル名（省略可）
language: ja
date: 2026-11-01                                    # 出版日（YYYY-MM-DD）
description: >-
  Markdownで書いた原稿から、Kindle（KDP）用のEPUB3を作る方法を解説するサンプル書籍です。
keywords: [Kindle, KDP, EPUB, Markdown, Pandoc]
rights: © 2026 山田 太郎

# ---- 識別子 ----
# KDP の電子書籍に ISBN は不要です（Amazon が ASIN を割り当てます）。
# ISBN を持っている場合だけ isbn を書きます。uuid は本ごとに固定の値にしてください
# （新しい本では `python3 -c "import uuid; print(uuid.uuid4())"` で作り直す）。
isbn: ""
uuid: 6f1c2a8e-3b4d-4e5f-9a10-2b3c4d5e6f70

# ---- 表紙 ----
# KDP 推奨: 高さ 2560 × 幅 1600 ピクセル（縦横比 1.6:1）、JPEG、RGB。
cover: images/cover.jpg
# 表紙を自動生成する場合は、下の cover_design のコメントを外します（cover より優先されます）。
# ビルドのたびに title / subtitle / author から dist/<名前>-cover.jpg を作り、EPUB に埋め込みます。
# cover_design:
#   style: auto                  # auto（layout.writing_mode に合わせる）/ vertical / horizontal
#   colors: ["#14213d", "#2c4f7c"]   # 1 色なら単色、2 色以上ならグラデーション
#   gradient: diagonal             # vertical / horizontal / diagonal / radial
#   # background: images/cover-bg.jpg   # 背景画像（指定すると colors の代わりに使う）
#   # font: sans                   # serif（明朝）/ sans（ゴシック）/ フォントファイルのパス
#   # author_suffix: " 著"

# ---- 原稿（この順番で 1 冊になります。省略すると chapters/*.md をファイル名順） ----
chapters:
  - chapters/00-preface.md
  - chapters/01-writing.md
  - chapters/02-build.md
  - chapters/03-publish.md
  - chapters/90-appendix.md

# ---- 組版 ----
layout:
  writing_mode: horizontal     # horizontal = 横書き・左綴じ / vertical = 縦書き・右綴じ
  toc_title: 目次
  toc_depth: 2                 # 目次に載せる見出しの深さ（1〜3）
  number_chapters: true        # 章番号を付ける（{.unnumbered} を付けた章は除く）
  chapter_label: "第{n}章"
  appendix_label: "付録{n}"
  figure_label: "図{c}.{n}"     # {c}=章番号, {n}=章内の通し番号
  table_label: "表{c}.{n}"
  listing_label: "リスト{c}.{n}"
  # highlight_style: styles/kindle.theme   # シンタックスハイライトの配色（pandoc の .theme か tango 等の名前）
  vertical:                    # 縦書きのときだけ使う設定
    code_blocks: sideways      # sideways / horizontal / vertical
    tables: sideways
    tcy_digits: 2              # 何桁までの数字を縦中横にするか

# ---- ペーパーバック（紙の本。python3 scripts/build.py --paperback で本文 PDF を作る） ----
# 寸法は KDP の本文の要件に合わせて自動で決まります（README の「ペーパーバック（紙の本）」を参照）。
paperback:
  trim: a5                     # 判型: 5x8 / 5.5x8.5 / 6x9 などの KDP 標準サイズ、a5 / b6、または {width: 128mm, height: 182mm}
  bleed: false                 # 裁ち落とし（画像や色を紙の端まで印刷するときだけ true）
  paper: white                 # white（白）/ cream（クリーム）/ color（カラー）… 表紙の背幅の計算に使う
  font: serif                  # 本文の書体: serif（明朝）/ sans（ゴシック）/ フォント名
  font_size: 9.5pt             # 本文の文字の大きさ
  line_height: 1.7             # 行送り（文字の大きさに対する倍率）
  # margins:                   # 余白（省略時の値）。ノドはページ数に応じた KDP の最小値より狭くならない
  #   top: 18mm
  #   bottom: 20mm
  #   outside: 15mm            # 小口（外側）
  #   inside: 18mm             # ノド（内側）
  # page_numbers: true         # ノンブル（地の小口側）
  # running_heads: true        # 柱（天の小口側に章タイトル）
  # colophon: true             # 巻末に奥付を入れる
  # isbn: ""                   # ペーパーバックの ISBN（KDP の無料 ISBN を使うなら割り当て後に書く）
  # colophon_notes:            # 奥付に足す行
  #   - 本書の内容に関するお問い合わせは……
  # output: my-book-paperback.pdf

# ---- KDP の登録情報の下書き（python3 scripts/kdp-listing.py で作る。省略可） ----
# 書いた項目は、原稿から作る下書きより優先されます（docs/kdp-listing.md を参照）。
# kdp:
#   description: >-            # 内容紹介の書き出し（省略すると description）
#     ……
#   closing: ……                # 内容紹介の最後に入れる文
#   keywords: [……]             # キーワードを固定する（7 つまで）
#   categories: [……]           # カテゴリーを固定する（3 つまで）

# ---- 追加の CSS（省略可） ----
# css:
#   - custom.css

# 出力ファイル名（省略すると dist/<ディレクトリ名>.epub）
# output: my-book.epub
